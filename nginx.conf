# Limite de peticiones a la API del chatbot (SEGURIDAD). Este archivo se
# incluye dentro del bloque http (conf.d/default.conf), por eso la zona va aqui,
# fuera de server.
# - Clave: IP del cliente ($binary_remote_addr; el contenedor publica el 80
#   directo, sin otro proxy delante). OJO: en la universidad muchas personas
#   salen por la misma IP (NAT), por eso los valores son holgados.
# - 10 r/s sostenidas con rafaga de 60 sin espera: abrir /techobot pide la
#   lista + los mensajes de cada conversacion a la vez (N+1 peticiones) y el
#   sondeo de un mensaje en proceso es 1 peticion cada 4 s por pestana; un aula
#   de ~30 personas detras de una IP no deberia toparse con el limite.
#   Lo que corta es un bucle o un script (cientos de peticiones por segundo).
# - El envio a Ollama ademas exige JWT y el backend solo admite un mensaje sin
#   resolver por conversacion: este limite es la ultima linea, no la unica.
# - 10m de memoria compartida = ~160.000 IPs. Exceso -> 429 (no 503).
limit_req_zone $binary_remote_addr zone=chatbot_api:10m rate=10r/s;

# HTTP -> HTTPS: redireccion permanente de todo el puerto 80. $host conserva
# el nombre/IP con que entro el cliente. Requiere que el 443 este publicado
# (docker-compose de techo360-infra: "443:443").
#
# Reto HTTP-01 de Let's Encrypt (certbot, contenedor efimero de techo360-infra: ver
# docs/certificado-letsencrypt.md): /.well-known/acme-challenge/ se sirve por HTTP,
# SIN redirigir, desde el webroot ./certbot/www (volumen read-only de techo360-infra).
# Todo lo demas sigue redirigiendo a HTTPS.
server {
    listen 80;
    server_name techo360.bucaramanga.upb.edu.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Certificado y llave: volumen read-only ./certs de techo360-infra
    # (autofirmado, SAN localhost/127.0.0.1/IP del VPS). OJO: sin ese
    # volumen montado nginx NO arranca (crash-loop).
    listen 443 ssl;
    # Dominio institucional (resuelve al VPS). Es el unico server del puerto, asi que
    # sigue siendo el default: entrar por la IP o por otro nombre se sigue sirviendo.
    server_name techo360.bucaramanga.upb.edu.co;
    ssl_certificate     /etc/nginx/certs/techo360.crt;
    ssl_certificate_key /etc/nginx/certs/techo360.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Compresion gzip (D3). Sin esto nginx servia /api/zonas (~5 MB de
    # GeoJSON) y el resto de JSON/JS/CSS sin comprimir. Medido sobre la
    # respuesta real: municipios 4.999 KB -> ~1.264 KB y departamentos
    # 141 KB -> ~36 KB (-75 %).
    # - nginx NO vuelve a comprimir una respuesta que ya traiga
    #   Content-Encoding (su filtro gzip la deja pasar tal cual), asi que
    #   un backend que algun dia responda ya comprimido no se comprime dos
    #   veces.
    # - gzip_proxied any: tambien comprime las respuestas de los proxy_pass
    #   (/api/, /auth/, ...), que es donde esta el peso.
    # - Nivel 4: buen punto entre tamaño y CPU (el contenedor tiene 0,15 CPU).
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/geo+json application/javascript text/javascript text/css text/plain image/svg+xml;

    # Cabeceras de seguridad baratas (SEGURIDAD). Sin CSP a proposito: una CSP
    # mal ajustada rompe los tiles de OpenStreetMap y los estilos de Leaflet.
    # `always` para que vayan tambien en errores. OJO: un add_header dentro de
    # un location ANULA los heredados de aqui, por eso se repiten en
    # /index.html y /assets/ (los unicos location con add_header propio).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend (React, build estatico)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Cache del navegador (D3b). index.html es el unico archivo que
    # referencia los bundles con hash; si el navegador lo conserva (sin
    # Cache-Control, nginx solo manda ETag/Last-Modified y el navegador
    # aplica cache heuristico), tras un despliegue sigue mostrando la
    # pagina vieja -- pasó verificando D2 (4-oct-2026).
    # "no-cache" NO es "no guardar": obliga a revalidar con el ETag (304
    # sin cuerpo si no cambio). Tambien cubre "/" y las rutas de la SPA,
    # porque `index index.html` y `try_files ... /index.html` hacen una
    # redireccion interna a /index.html y este bloque es el que responde.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # /assets/ lo genera Vite con hash en el nombre (index-C0ZFxbes.js,
    # etc.): el contenido de un nombre nunca cambia, asi que se guarda un
    # año. try_files ... =404 (no el fallback a index.html de arriba):
    # un chunk viejo que ya no exista debe dar 404, no HTML marcado como
    # immutable. Se usa add_header y no `expires` para no duplicar el
    # encabezado Cache-Control. SIN `always`: add_header solo se aplica a
    # 200/201/204/206/301/302/303/304/307/308, asi el 404 de un chunk viejo
    # NO lleva "immutable" (el navegador no lo guarda un año).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Backend Principal (mapa de calor, auth, actualizacion de datos)
    # Sin barra final en proxy_pass -- nginx pasa la URI original completa
    # (incluido el prefijo /api/) al backend sin recortarla. El backend
    # monta sus rutas en /api/... (ver routers/zonas.py, routers/usuarios.py),
    # asi que el prefijo debe preservarse, no eliminarse.
   location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Respuestas grandes de /api/zonas (~5 MB)
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 40 128k;
    proxy_busy_buffers_size 256k;

    # El RPC puede tardar hasta 200 s
    proxy_connect_timeout 200s;
    proxy_send_timeout 200s;
    proxy_read_timeout 200s;
}

    # Autenticacion (login, registro, usuario actual) -- el backend monta
    # estas rutas en /auth/... (prefix="/auth", sin /api/, ver
    # routers/auth.py), fuera del bloque /api/ de arriba. Sin este bloque,
    # las peticiones a /auth/login caian en el location / generico y
    # devolvian el index.html de la SPA en vez de la respuesta real del
    # backend -- causa confirmada del login roto para usuarios reales,
    # arreglado y verificado en vivo en produccion el 01-sep-2026.
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Verificacion OTP (registro, recuperacion de contraseña) -- el
    # backend monta estas rutas en /otp/... (prefix="/otp", sin /api/,
    # ver routers/otp.py), mismo patron exacto que /auth/ arriba (sin
    # barra final en proxy_pass, para no recortar el prefijo). Sin este
    # bloque, /otp/request y /otp/verify caian en el location / generico
    # y nginx devolvia 405/index.html en vez de llegar al backend --
    # hallazgo documentado desde el 01-sep-2026 (commit e94d004 del
    # backend), confirmado en vivo y arreglado aqui.
    location /otp/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Persistencia de chatbot (T-98/T-99/T-101/T-102) -- el backend monta
    # estas rutas literalmente como /chatbot/conversaciones y
    # /chatbot/mensajes/... (sin /api/, por diseño del backlog), lo que
    # colisiona con el prefijo /chatbot/ de mas abajo (servicio de IA).
    # nginx ya elige el location de prefijo mas largo/especifico sin
    # importar el orden, pero se declaran antes por legibilidad, mismo
    # patron que /auth/ y /otp/. Sin barra final en proxy_pass -- el
    # backend espera el path completo, no recortado.
    location /chatbot/conversaciones {
        limit_req zone=chatbot_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST .../mensajes/enviar espera la respuesta real de Ollama via
        # RPC (services/chatbot_rpc_client.py del backend, timeout 200s --
        # cubre el fallback del VPS sin pool de laboratorio conectado,
        # medido real hasta ~180s). Sin esto, nginx corta la conexion a
        # los 60s por defecto (proxy_read_timeout) y devuelve su propio
        # 504 HTML ANTES de que el backend responda -- confirmado real
        # verificando el ChatBot ya desplegado (27-sep-2026): el backend
        # nunca llega a devolver su propio 503/504 JSON con mensaje util,
        # nginx se adelanta con una pagina generica.
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
    }

    location /chatbot/mensajes {
        limit_req zone=chatbot_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST .../reintentar espera al RPC del backend (hasta 200 s) igual que el
        # envio en /chatbot/conversaciones. Sin esto nginx corta a los 60 s (valor
        # por defecto) con su propio 504 aunque el backend siga y termine bien.
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
    }

    # SEGURIDAD: se eliminaron `location /chatbot/send` y el generico
    # `location /chatbot/` (proxy directo al contenedor chatbot:8000). Exponian
    # sin sesion ni limite POST /chatbot/send, que recibia usuario_id y
    # conversacion_id en el cuerpo (inyeccion en conversaciones ajenas y carga
    # de Ollama), y cualquier otra ruta del servicio (/docs, /openapi.json).
    # Nadie legitimo los usaba: el frontend habla con el chatbot SOLO a traves
    # del backend (/chatbot/conversaciones y /chatbot/mensajes, con JWT), y las
    # herramientas de evaluacion de techo360-chatbot/training levantan el
    # servicio en 127.0.0.1 sin pasar por este nginx. Cualquier otra ruta
    # /chatbot/... cae ahora en `location /` (index.html de la SPA).

}
